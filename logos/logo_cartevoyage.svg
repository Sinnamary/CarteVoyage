<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Logo CarteVoyage</title>
  <desc id="desc">Logo représentant une carte pliée, un trajet et une épingle de localisation pour le projet CarteVoyage.</desc>
  <defs>
    <linearGradient id="mapGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf7f4"/>
      <stop offset="100%" stop-color="#dff0ff"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#e74c3c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1f2d3d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="720" height="220" fill="none"/>

  <!-- Emblème -->
  <g transform="translate(36 30)" filter="url(#softShadow)">
    <!-- Carte pliée -->
    <path d="M18 36 L75 18 L132 36 L189 18 Q202 14 202 28 L202 138 Q202 148 192 151 L132 169 L75 151 L18 169 Q6 173 6 158 L6 50 Q6 40 18 36 Z" fill="url(#mapGradient)" stroke="#1f6f8b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M75 18 L75 151" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-opacity="0.35"/>
    <path d="M132 36 L132 169" fill="none" stroke="#1f6f8b" stroke-width="4" stroke-opacity="0.35"/>

    <!-- Itinéraire -->
    <path d="M33 121 C55 84, 89 122, 107 83 S154 49, 178 78" fill="none" stroke="#27ae60" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 18"/>
    <path d="M33 121 C55 84, 89 122, 107 83 S154 49, 178 78" fill="none" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>

    <!-- Points de visite -->
    <circle cx="33" cy="121" r="10" fill="#3498db" stroke="#ffffff" stroke-width="4"/>
    <circle cx="107" cy="83" r="10" fill="#f39c12" stroke="#ffffff" stroke-width="4"/>
    <circle cx="178" cy="78" r="10" fill="#9b59b6" stroke="#ffffff" stroke-width="4"/>

    <!-- Pin principal -->
    <g transform="translate(103 43)">
      <path d="M28 0 C12.5 0 0 12.5 0 28 C0 49 28 78 28 78 C28 78 56 49 56 28 C56 12.5 43.5 0 28 0 Z" fill="url(#pinGradient)" stroke="#ffffff" stroke-width="5"/>
      <circle cx="28" cy="28" r="12" fill="#ffffff"/>
    </g>
  </g>

  <!-- Texte -->
  <g transform="translate(285 72)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#1f2d3d" letter-spacing="-1.5">
      Carte<tspan fill="#1f6f8b">Voyage</tspan>
    </text>
    <text x="2" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#5f6f7c">
      Planifier • Visualiser • Explorer
    </text>
    <path d="M4 66 H280" stroke="#1f6f8b" stroke-width="5" stroke-linecap="round" opacity="0.18"/>
  </g>
</svg>
